name: lint
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in bin/l4c lib/*.sh setup/*.sh migrate/*.sh install/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -f gcc bin/l4c lib/*.sh setup/*.sh migrate/*.sh install/*.sh
      - name: keyd config generation
        run: bash setup/chromebook.sh gen-keyd
