<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- l4c: 只装简体中文字体（思源黑体 CN）以节省空间，并把常见的 Windows / Noto 中文字体名映射过来 -->
<fontconfig>
  <alias binding="same"><family>Noto Sans CJK SC</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>Microsoft YaHei</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>微软雅黑</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>SimHei</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Source Han Sans CN</family></prefer></alias>
  <!-- 等宽字体必须强绑定：系统语言是中文时，弱绑定会让 fontconfig 把思源黑体（比例字体）排到最前，
       终端就按全角宽度划格子，英文字母之间全是空隙。中文字形仍由后面的思源黑体补上。 -->
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>monospace</family><default><family>Source Han Sans CN</family></default></alias>
</fontconfig>
