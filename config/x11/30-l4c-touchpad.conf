# l4c: 触控板（与 Windows 笔记本习惯一致）
Section "InputClass"
    Identifier "l4c touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "ClickMethod" "clickfinger"
    Option "NaturalScrolling" "false"
    Option "DisableWhileTyping" "on"
EndSection
