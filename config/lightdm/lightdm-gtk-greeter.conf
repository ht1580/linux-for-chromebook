# l4c: Windows 11 风格的登录 / 锁屏界面（lightdm-gtk-greeter，只改配置，不增加任何程序）
[greeter]
background=/usr/share/backgrounds/l4c/l4c-win11.png
user-background=false
theme-name=Fluent-Dark
icon-theme-name=Fluent-dark
cursor-theme-name=Bibata-Modern-Ice
cursor-theme-size=24
font-name=Noto Sans CJK SC 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
# 登录框放在屏幕正中，状态栏（时钟、语言、电源）在底部，和 Win11 一样
position=50%,center 55%,center
panel-position=bottom
indicators=~spacer;~clock;~spacer;~language;~a11y;~power
clock-format=%H:%M    %m月%d日 %A
round-user-image=true
hide-user-image=false
default-user-image=#avatar-default
# 登录界面闲置 60 秒后关屏省电
screensaver-timeout=60
